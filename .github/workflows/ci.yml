name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  no-simulation-guard:
    name: No-Simulation Policy Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify No Simulated/Fake Logic
        run: python scripts/check_no_simulation.py

  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: no-simulation-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install "email-validator>=2.0.0" pytest pytest-asyncio pytest-cov ruff
          pip install -e "./backend[dev]"
      - name: Lint with Ruff
        run: ruff check backend/src backend/tests || true
      - name: Run Tests with Coverage
        run: |
          PYTHONPATH=backend pytest -p no:langsmith --cov=src --cov-report=xml --cov-report=term-missing backend/tests/

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install --legacy-peer-deps
      - name: TypeScript Validation
        working-directory: frontend
        run: npm run build
